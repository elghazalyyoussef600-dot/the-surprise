<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love You ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.page {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.hidden {
    display: none;
}


/* =========================
   الظرف
========================= */

.envelope-container {
    text-align: center;
    cursor: pointer;
}

.envelope {
    width: 210px;
    height: 135px;
    background: #eeeeee;
    position: relative;
    border-radius: 8px;
    box-shadow: 0 0 25px rgba(255,255,255,0.15);
    transition: 0.3s;
}

.envelope:hover {
    transform: scale(1.05);
}

.envelope::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;

    border-left: 105px solid transparent;
    border-right: 105px solid transparent;
    border-top: 72px solid #d5d5d5;
}

.envelope-heart {
    position: absolute;
    left: 50%;
    top: 60px;
    transform: translate(-50%, -50%);
    font-size: 40px;
    z-index: 2;
}

.envelope-text {
    margin-top: 22px;
    font-size: 18px;
}


/* =========================
   الصفحة الثانية
========================= */

.heart-page {
    flex-direction: column;
}

#heart {
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: scale(0.68);
    gap: 1px;
}

.row {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 2px;

    height: 18px;
    white-space: nowrap;
}


/* LOVE YOU */

.love {
    display: block;

    width: 67px;

    text-align: center;

    font-size: 13px;
    font-weight: bold;

    color: white;

    margin: 0;
    padding: 0;

    letter-spacing: -0.5px;

    opacity: 0;

    animation: appear 0.35s ease forwards;
}


@keyframes appear {

    from {
        opacity: 0;
        transform: scale(0.6);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}


/* =========================
   Made by
========================= */

.credit {
    margin-top: -20px;
    font-size: 13px;
    color: #888;
    letter-spacing: 1px;
}


/* =========================
   الموبايل
========================= */

@media (max-width: 600px) {

    #heart {
        transform: scale(0.55);
    }

    .love {
        width: 63px;
        font-size: 12px;
        letter-spacing: -0.7px;
    }

    .row {
        height: 17px;
        gap: 2px;
    }

    .credit {
        margin-top: -10px;
        font-size: 11px;
    }

}

</style>
</head>


<body>


<!-- الصفحة الأولى -->

<section id="page1" class="page">

    <div class="envelope-container" onclick="openEnvelope()">

        <div class="envelope">

            <div class="envelope-heart">
                ❤️
            </div>

        </div>

        <div class="envelope-text">
            اضغطي على الظرف
        </div>

    </div>

</section>



<!-- الصفحة الثانية -->

<section id="page2" class="page heart-page hidden">

    <div id="heart"></div>

    <div class="credit">
        Made by youssef elghazaly
    </div>

</section>



<script>

function openEnvelope() {

    document.getElementById("page1").classList.add("hidden");

    document.getElementById("page2").classList.remove("hidden");

    createHeart();
}


function createHeart() {

    const heart = document.getElementById("heart");

    let delay = 0;


    const rows = [

        ["LOVE YOU", "LOVE YOU", "", "LOVE YOU", "LOVE YOU"],

        ["LOVE YOU", "LOVE YOU", "", "LOVE YOU", "LOVE YOU"],

        ["LOVE YOU", "LOVE YOU", "LOVE YOU", "LOVE YOU", "LOVE YOU"],

        ["LOVE YOU", "LOVE YOU", "LOVE YOU", "LOVE YOU", "LOVE YOU"],

        [
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU"
        ],

        [
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU"
        ],

        [
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU"
        ],

        [
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU"
        ],

        [
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU"
        ],

        [
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU"
        ],

        [
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU"
        ],

        [
            "LOVE YOU",
            "LOVE YOU",
            "LOVE YOU"
        ],

        [
            "LOVE YOU",
            "LOVE YOU"
        ],

        [
            "LOVE YOU"
        ]

    ];


    rows.forEach(words => {

        const row = document.createElement("div");

        row.className = "row";


        words.forEach(word => {

            const love = document.createElement("span");

            love.className = "love";

            love.textContent = word;

            love.style.animationDelay = delay + "ms";

            delay += 45;

            row.appendChild(love);

        });


        heart.appendChild(row);

    });

}

</script>

</body>
</html>
